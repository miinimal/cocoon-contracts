name: contracts-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [func, tolk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Client refund suite and client/integration regressions
        run: |
          if [ "${{ matrix.lang }}" = "tolk" ]; then export USE_TOLK=true; fi
          npx jest --ci tests/ClientRefund.issue77.spec.ts tests/CocoonClient.spec.ts tests/CocoonClient.comprehensive.part1.spec.ts tests/CocoonClient.comprehensive.part2.spec.ts tests/Integration.spec.ts
